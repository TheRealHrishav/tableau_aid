[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-smith"
version = "0.1.0"
description = "Prototype tool to address dependency of calculated fields while parsing tableau to sql"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "networkx",
    "lark",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[tool.setuptools.packages.find]
include = ["graph_smith*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
